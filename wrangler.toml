# Haus-Quest – ein Worker liefert die Seite und die Schnittstelle.
name = "bubu-app"
main = "worker/index.js"
compatibility_date = "2026-08-01"
account_id = "c96097fc58419e9dc3df6cc67d7aaa9c"

# Die statischen Dateien: Startseite, App, Symbole, Service Worker.
[assets]
directory = "./web"
binding = "ASSETS"
not_found_handling = "single-page-application"

# Eigene Datenbank, ausschließlich für diese App.
[[d1_databases]]
binding = "DB"
database_name = "haus-quest"
database_id = "a0688e8f-82e6-432e-b98c-e68a944381f8"
migrations_dir = "d1/migrations"

[vars]
BASIS_URL = "https://haus-quest.com"
GOOGLE_CLIENT_ID = "600393178714-ds40oku8g1qskci4vsngrihre3ps0hal.apps.googleusercontent.com"

# Geheimnisse werden nie hier abgelegt, sondern gesetzt mit:
#   wrangler secret put GOOGLE_CLIENT_SECRET
#   wrangler secret put SESSION_SECRET
#   wrangler secret put VAPID_PRIVATE_KEY
