<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Haus-Quest</title>
<meta name="theme-color" content="#152c4f">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon-192.png" type="image/png">
<style>
:root { --ground:#fff; --ink:#152c4f; --ink-2:#55688a; --accent:#ec0f06; --tint:#f4f7fc; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --ground:#0b1830; --ink:#e9f0fb; --ink-2:#a5b6d1; --tint:#11223d; --accent:#ff4b42; }
}
body {
  margin:0; min-height:100dvh; background:var(--ground); color:var(--ink);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:14px; padding:32px 24px; text-align:center;
}
img { width:min(220px,60vw); }
h1 { font-size:28px; letter-spacing:-.03em; margin:0; }
p { color:var(--ink-2); margin:0; max-width:30ch; line-height:1.55; }
.stand { background:var(--tint); border-radius:14px; padding:12px 16px; font-size:14px; color:var(--ink-2); }
</style>
</head>
<body>
  <img src="/logo.webp" alt="">
  <h1>Gleich geht’s los</h1>
  <p>Die App wird gerade gebaut. Diese Seite ist schon die richtige — sobald sie fertig ist, erscheint sie hier von selbst.</p>
  <p class="stand">Angeheftet? Dann bist du fertig vorbereitet. Beim nächsten Öffnen ist die App da.</p>
</body>
</html>
