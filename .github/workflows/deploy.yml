name: Deploy

# Jeder Push auf main geht live. Der Schlüssel liegt als Repository-Secret
# und verlässt GitHub nie.
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "README.md", "supabase/**"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Auf Cloudflare veröffentlichen
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
